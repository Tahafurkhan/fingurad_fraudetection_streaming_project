# Fraud watchlist files landed into a Unity Catalog volume and picked up
# incrementally by Auto Loader.
#
# inferColumnTypes is on because the upstream feed is JSON without a contract.
# _rescued_data is carried through deliberately: it captures fields that do not
# match the inferred schema, which is how schema drift becomes visible instead
# of silently dropping data.
name: fraud_watchlist
target: finguard.bronze.fraud_watchlist
comment: "Raw fraud watchlist entries ingested by Auto Loader"

ingestion:
  type: autoloader
  path: /Volumes/finguard/source/fraud_watchlist/source_data/
  format: json
  # Bound the per-batch file count so a backlog in the source path is processed
  # over several batches instead of one. Measured effect at current volume:
  # none -- files arrive a few at a time. It matters after any outage where
  # files accumulate while the stream is down.
  max_files_per_trigger: 100
  options:
    cloudFiles.inferColumnTypes: "true"

optimization:
  # No clustering keys, deliberately.
  #
  # 93 rows across 19 files. Clustering works by letting a query skip files;
  # with this little data there is nothing worth skipping, and declaring keys
  # would add metadata for no benefit. Knowing when NOT to apply an
  # optimization is the point -- see docs/performance_optimization.md.
  #
  # What this table DOES need is compaction: 19 files for 93 rows is ~5KB per
  # file against a target measured in megabytes. optimizeWrite and autoCompact
  # come from the framework defaults and address exactly that.
  cluster_by: []

columns:
  - {name: watchlist_id}
  - {name: watch_type}
  - {name: entity_id}
  - {name: risk_level}
  - {name: action}
  - {name: reason_code}
  - {name: reason_description}
  - {name: status}
  - {name: effective_from}
  - {name: reported_by}
  - {name: reported_source}
  - {name: country}
  - {name: city}
  - {name: _rescued_data}
  # File provenance: which file each row came from, for auditing and replay.
  - {name: source_file, expr: "_metadata.file_path"}
