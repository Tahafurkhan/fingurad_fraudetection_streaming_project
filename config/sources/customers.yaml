# Customer master data, ingested from Neon Postgres by a Lakeflow *managed*
# ingestion pipeline (see resources/fingurad_ingestion.json).
#
# IMPORTANT: this source is NOT generated by the bronze framework. Managed
# ingestion pipelines are declared as a pipeline spec, not as @dp.table code,
# so there is nothing for the generator to build. This file exists so the
# source registry is complete -- every bronze table has one config describing
# where it comes from -- and the generator skips it via `managed: true`.
#
# Credentials live in the Unity Catalog connection `finguard_connection`,
# which stores them write-only; they are never exposed to the pipeline code.
name: customers
target: finguard.bronze.customers
comment: "Customer master ingested from Postgres via Lakeflow managed CDC"
managed: true

ingestion:
  type: managed_cdc
  source_system: postgresql
  connection_name: finguard_connection
  database: neondb
  schema: public
  table: customers
  # customer_id identifies the row; update_timestamp is the cursor the pipeline
  # uses to find rows changed since the last run. This is what makes SCD2
  # possible downstream -- customer attributes are mutable at source, and each
  # change is re-ingested rather than being lost.
  primary_keys: [customer_id]
  cursor_columns: [update_timestamp]
  ingestion_mode: query_based
  pipeline_id: b1b8c9c5-c341-4a33-9d22-d3a98da1fa9e
