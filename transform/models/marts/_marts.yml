version: 2

models:
  - name: dim_merchant
    description: >
      Merchant dimension with SCD2 history. One row per merchant per version;
      join facts on merchant_sk, not merchant_id.
    columns:
      - name: merchant_sk
        description: Surrogate key - unique per merchant version.
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        description: Natural key - NOT unique, repeats across versions.
        data_tests: [not_null]
      - name: merchant_risk
        data_tests:
          - accepted_values:
              values: ["LOW", "MEDIUM", "HIGH"]
      - name: is_current
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_customer
    description: >
      Customer dimension with SCD2 history on the attributes that drive fraud
      evaluation: segment, risk score, city, transaction limit.
    columns:
      - name: customer_sk
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests: [not_null]
      - name: risk_band
        data_tests:
          - accepted_values:
              values: ["LOW", "MEDIUM", "HIGH"]
      - name: card_number_masked
        description: Only the last four digits are exposed.
      - name: is_current
        data_tests: [not_null]

  - name: dim_date
    description: Generated calendar dimension covering 2024-2027.
    columns:
      - name: date_key
        description: Integer surrogate key in yyyyMMdd form.
        data_tests:
          - not_null
          - unique
      - name: full_date
        data_tests: [not_null, unique]
      - name: is_weekend
        data_tests: [not_null]

  - name: fct_alerts
    description: >
      Alerts raised by the Lakeflow streaming pipeline, enriched with
      point-in-time dimension context. Detection rules are NOT recomputed here
      -- the streaming layer owns detection, this model owns analysis of it.
    columns:
      - name: alert_id
        data_tests:
          - not_null
          - unique
      - name: transaction_id
        data_tests: [not_null]
      - name: alert_type
        data_tests:
          - accepted_values:
              values: ["FRAUD_WATCHLIST_MATCH", "HIGH_VALUE_TRANSACTION"]
      - name: detection_latency_seconds
        description: >
          Seconds between transaction and alert. Measures the pipeline's real
          SLA rather than an assumed one.
      - name: transaction_timestamp
        data_tests: [not_null]

  - name: agg_daily_fraud_summary
    description: Daily transaction and alert metrics by customer segment.
    columns:
      - name: transaction_date
        data_tests: [not_null]
      - name: transaction_count
        data_tests: [not_null]
      - name: alert_rate_pct
        description: Alerts per hundred transactions.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_date
            - customer_segment

  - name: agg_merchant_risk_profile
    description: >
      Declared versus observed merchant risk. risk_rating_understated flags
      merchants whose behaviour is worse than their rating suggests.
    columns:
      - name: merchant_id
        data_tests:
          - not_null
          - unique
      - name: observed_risk
        data_tests:
          - accepted_values:
              values: ["LOW", "MEDIUM", "HIGH", "BLACKLISTED"]
      - name: transaction_count
        data_tests: [not_null]

  - name: fct_transactions
    description: >
      Transaction fact, incremental. Dimension attributes are resolved as of
      the transaction timestamp, not as of the current dimension state.
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests: [not_null]
      - name: merchant_id
        data_tests: [not_null]
      - name: amount
        description: Transaction amount; the pipeline drops non-positive values.
      - name: transaction_timestamp
        data_tests: [not_null]
      - name: is_high_value
        data_tests: [not_null]

      - name: date_key
        description: >
          Foreign key to dim_date, derived from transaction_timestamp (event
          time), never from load time. A transaction that occurred on the 10th
          and arrived on the 13th belongs to the 10th.
        data_tests:
          - not_null
          # The relationships test is the one that earns its place here.
          # dim_date is generated over a fixed range (2024-2027), so a
          # transaction outside that range produces a key pointing at nothing.
          # Every join to the calendar silently drops those rows, and a daily
          # report simply omits a day rather than failing. Bad source
          # timestamps are exactly how that happens: an epoch-0 default lands
          # in 1970, a millisecond timestamp read as seconds lands in the far
          # future.
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: arrival_delay_hours
        description: >
          Event time to silver arrival, in hours. Upstream delivery delay --
          not this platform's processing time, which lives in ops.job_sla.
        data_tests:
          - not_null
          # Negative delay means a transaction arrived before it happened,
          # which is a clock problem, not a data problem: a producer with a
          # skewed clock, or a timestamp stamped at the wrong stage. Worth
          # failing on, because every watermark in the streaming layer assumes
          # event time is broadly well-behaved (TRD ASM-05) and a negative
          # value is direct evidence that assumption has broken.
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: is_late_arrival
        description: Landed on a later calendar day than it occurred.
        data_tests: [not_null]

      - name: arrival_delay_days
        description: >
          Whole days between event time and silver arrival. Compared against
          late_arrival_window_days to detect the incremental overlap window
          becoming too narrow.
        data_tests: [not_null]

  - name: late_arrival_monitor
    description: >
      Daily arrival-delay profile. Makes the incremental overlap window an
      evidence-based setting rather than a guess, and gives alerting a column
      to watch before the window starts silently dropping rows.
    columns:
      - name: transaction_date
        data_tests: [not_null, unique]
      - name: transactions
        data_tests: [not_null]
      - name: late_pct
        description: Percentage of the day's transactions that crossed a day boundary.
      - name: p95_delay_hours
        description: >
          Reported alongside the average because arrival delay is heavily
          right-skewed -- nearly everything lands in seconds and a few retries
          land hours later, so the mean describes no actual transaction.
      - name: headroom_days
        description: >
          Slack remaining before the overlap window stops covering observed
          lateness. The column an alert should watch: it reaches zero before
          data goes missing.
        data_tests: [not_null]
      - name: window_status
        data_tests:
          - not_null
          - accepted_values:
              values: ["OK", "AT_RISK", "BREACHED"]
