name: finguard
version: "1.0.0"
config-version: 2

profile: finguard

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Boundary rule: Lakeflow owns bronze and silver, dbt owns marts. Nothing is
# defined in both places. dbt reads silver as a source and never writes to it.
models:
  finguard:
    staging:
      # Views: staging is renaming and light typing, so materialising would
      # duplicate silver for no benefit. Views keep the lineage honest and cost
      # nothing to rebuild.
      +materialized: view
    marts:
      +materialized: table
      # File management for every mart, so a new model inherits it rather than
      # relying on whoever adds it to remember.
      #
      # These are the same properties the streaming layer sets on its Delta
      # tables. Marts are rebuilt or merged rather than streamed, so they
      # accumulate small files more slowly -- but an incremental model doing a
      # merge every run still rewrites files each time, and without compaction
      # those fragments persist.
      #
      # The key is `tblproperties`, NOT `table_properties`. dbt accepts any
      # config key it does not recognise, stores it in the manifest, and never
      # applies it -- the run succeeds and the table is left unoptimised. That
      # happened here: `table_properties` parsed cleanly, appeared in
      # target/manifest.json, and produced a table with no properties set at
      # all. Verified against DESCRIBE DETAIL rather than trusting the run
      # result. See docs/performance_optimization.md.
      +tblproperties:
        delta.autoOptimize.optimizeWrite: "true"
        delta.autoOptimize.autoCompact: "true"
        delta.tuneFileSizesForRewrites: "true"

# dbt's default generate_schema_name appends the model's schema config to the
# target schema, producing `marts_marts`. The override in macros/ uses the
# custom schema verbatim instead, so models land in `finguard.marts` as
# configured in profiles.yml.

snapshots:
  finguard:
    +target_schema: snapshots
    # Delta supports MERGE, which is what dbt snapshots need to close out old
    # versions and insert new ones in a single atomic statement.
    +file_format: delta

vars:
  # Fraud-scoring threshold, referenced by marts rather than hardcoded per
  # model so the rule lives in one place.
  high_value_threshold: 100000
