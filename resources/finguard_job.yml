# End-to-end orchestration: ingest, then model, then verify.
#
# Without this, the Lakeflow pipeline and the dbt project are two things a
# human runs in the right order and hopes nothing drifted. The dependency is
# real -- dbt reads finguard.silver and finguard.gold, so running it against a
# stale pipeline produces marts that look fine and are quietly wrong. Encoding
# the order here is the difference between a scheduled platform and a set of
# scripts.

resources:
  jobs:
    finguard_daily:
      name: finguard_daily_pipeline

      schedule:
        # 02:00 IST daily. Chosen because the transaction simulator runs during
        # the day, so an overnight run sees a complete day rather than a
        # partial one.
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Asia/Kolkata
        # Per-target. Previously hardcoded PAUSED, which meant this job -- the
        # only thing sequencing ingestion before dbt -- never fired. Every
        # freshness test, SLA measurement and mart refresh depended on someone
        # remembering to click Run. A platform that only runs when watched is a
        # script.
        pause_status: ${var.job_schedule_pause}

      # One run at a time. Two concurrent runs would have dbt reading tables
      # another run is mid-write on.
      max_concurrent_runs: 1

      # Bound the blast radius of a hung run.
      #
      # Without a timeout, a task that hangs rather than fails holds serverless
      # compute open until someone notices -- and "someone notices" is not a
      # cost control. The whole DAG completes in single-digit minutes at this
      # volume, so 2 hours is generous enough to absorb a slow cold start while
      # still capping what a stuck run can spend.
      timeout_seconds: 7200

      # Cost attribution, matching the pipelines. See finguard_pipeline.yml for
      # why these exist rather than relying on usage_metadata alone.
      tags:
        project: finguard
        environment: ${bundle.target}
        cost_center: data-engineering
        owner: tahafurkhan@gmail.com

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      # dbt tasks need somewhere to run the dbt process itself, separately from
      # the SQL warehouse that executes the generated SQL. A serverless
      # environment avoids defining and paying for a job cluster that would sit
      # idle between the short dbt invocations.
      environments:
        - environment_key: dbt_env
          spec:
            client: "3"
            dependencies:
              - dbt-databricks>=1.12.0,<2.0.0

        # The pipeline metrics collector needs no third-party packages -- it is
        # Spark SQL against the event log. A separate environment rather than
        # reusing dbt_env so it does not install dbt to run a task that never
        # calls it, and so a dbt version bump cannot affect monitoring.
        #
        # databricks-sdk is the one addition, needed by the job metrics
        # collector: job run history comes from the Jobs API, not from a table.
        # The SDK ships on Databricks Runtime, but it is declared explicitly
        # rather than relied upon -- a task that works because of what the
        # runtime happens to preinstall breaks silently on a runtime upgrade.
        - environment_key: ops_env
          spec:
            client: "3"
            dependencies:
              - databricks-sdk

      tasks:
        # 1. Ingest. Bronze and silver from Kafka, volumes and CDC; streaming
        #    gold alerts computed in the same update.
        - task_key: ingest_streaming
          pipeline_task:
            pipeline_id: ${resources.pipelines.finguard_pipeline.id}
            full_refresh: false

        # 2. Customer silver, independent of the Kafka path.
        - task_key: ingest_customers
          pipeline_task:
            pipeline_id: ${resources.pipelines.finguard_customers_pipeline.id}
            full_refresh: false

        # 3. Snapshots BEFORE models. This ordering is load-bearing: snapshots
        #    capture the current state of mutable dimensions, and running them
        #    after the models would mean the dimensions are built from
        #    yesterday's snapshot while the facts use today's data.
        - task_key: dbt_snapshot
          depends_on:
            - task_key: ingest_streaming
            - task_key: ingest_customers
          environment_key: dbt_env
          dbt_task:
            project_directory: ../transform
            profiles_directory: ../transform
            commands:
              - "dbt deps"
              - "dbt snapshot --target ${bundle.target}"
            warehouse_id: b349348047ac54a2

        # 4. Build the marts.
        - task_key: dbt_run
          depends_on:
            - task_key: dbt_snapshot
          environment_key: dbt_env
          dbt_task:
            project_directory: ../transform
            profiles_directory: ../transform
            commands:
              - "dbt run --target ${bundle.target}"
            warehouse_id: b349348047ac54a2

        # 5. Test last, as a gate. Tests that run before the models they check
        #    are decoration; running them here means a failure is a real signal
        #    that something downstream should not be trusted.
        - task_key: dbt_test
          depends_on:
            - task_key: dbt_run
          environment_key: dbt_env
          dbt_task:
            project_directory: ../transform
            profiles_directory: ../transform
            commands:
              - "dbt test --target ${bundle.target}"
            warehouse_id: b349348047ac54a2

        # 6. Source freshness, non-blocking. A stale source is worth knowing
        #    about but is not a reason to fail a run that otherwise succeeded --
        #    it usually means an upstream system is quiet, not that this
        #    pipeline is broken.
        - task_key: dbt_source_freshness
          depends_on:
            - task_key: dbt_test
          environment_key: dbt_env
          dbt_task:
            project_directory: ../transform
            profiles_directory: ../transform
            commands:
              - "dbt source freshness --target ${bundle.target}"
            warehouse_id: b349348047ac54a2
          # Freshness warnings should not mark the run failed.
          disable_auto_optimization: true

        # 7. Collect telemetry into the ops tables that alerts query.
        #
        #    RUN_IF: ALL_DONE, NOT ALL_SUCCESS. This is the load-bearing detail.
        #    The run worth diagnosing is the run that failed, so a collector
        #    that only executes on success gathers evidence for every case
        #    except the one that matters. `all_done` means it runs whatever
        #    happened upstream.
        #
        #    It depends on the two ingest tasks rather than on dbt_source_
        #    freshness, because the telemetry it reads comes from the pipeline
        #    updates. Chaining it behind dbt would make a dbt failure hide
        #    pipeline diagnostics that were already available.
        - task_key: collect_metrics
          depends_on:
            - task_key: ingest_streaming
            - task_key: ingest_customers
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../src/pipelines/ops/metrics_collector.py
            parameters:
              - "--pipeline-ids"
              - "${resources.pipelines.finguard_pipeline.id},${resources.pipelines.finguard_customers_pipeline.id}"
          environment_key: ops_env
          # Monitoring must not fail the run it monitors. A red pipeline caused
          # entirely by its own observability is worse than no observability --
          # it trains people to ignore the colour.
          disable_auto_optimization: true

        # 8. Job-level telemetry and SLA measurement.
        #
        #    WHY THIS IS SEPARATE FROM collect_metrics. That task mines the
        #    *pipeline* event log, which covers everything inside a Lakeflow
        #    update and nothing outside one. The dbt tasks, a task skipped
        #    because an upstream one failed, a run killed by its timeout, or a
        #    run that never fired at all leave no trace in a pipeline event
        #    log -- because no pipeline update happened. OB-01 claims every run
        #    is queryable; without this task that is only true of pipeline runs.
        #
        #    It also measures NFR-01. A 15-minute target that is never measured
        #    is an aspiration, not an SLA.
        #
        #    RUNS LAST, and depends on the final dbt task rather than on
        #    ingestion. It reports on the run it is part of, so the more of
        #    that run has finished, the more complete its picture. It cannot
        #    see its own outcome -- that appears in the next run's collection,
        #    which is inherent to a job observing itself and is why the table
        #    is append-only and watermarked rather than updated in place.
        - task_key: collect_job_metrics
          depends_on:
            - task_key: dbt_source_freshness
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../src/pipelines/ops/job_metrics_collector.py
            parameters:
              - "--job-ids"
              - "${resources.jobs.finguard_daily.id}"
          environment_key: ops_env
          disable_auto_optimization: true
